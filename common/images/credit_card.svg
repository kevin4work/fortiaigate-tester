<svg viewBox="0 0 340 214" xmlns="http://www.w3.org/2000/svg">
  <!-- Card background -->
  <rect x="4" y="4" width="332" height="206" rx="16" fill="#2a2a3e" stroke="#555" stroke-width="2"/>

  <!-- Chip -->
  <rect x="24" y="50" width="40" height="30" rx="4" fill="#d4a843"/>
  <rect x="28" y="54" width="32" height="22" rx="2" fill="#c4982f"/>
  <line x1="34" y1="54" x2="34" y2="76" stroke="#d4a843" stroke-width="1.5"/>
  <line x1="44" y1="54" x2="44" y2="76" stroke="#d4a843" stroke-width="1.5"/>
  <line x1="54" y1="54" x2="54" y2="76" stroke="#d4a843" stroke-width="1.5"/>

  <!-- Contactless symbol -->
  <path d="M80 56 Q88 56 88 64 Q88 72 80 72" stroke="#888" stroke-width="2" fill="none"/>
  <path d="M84 52 Q94 52 94 64 Q94 76 84 76" stroke="888" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Card number blocks (redacted) -->
  <rect x="24" y="100" width="60" height="10" rx="2" fill="#444"/>
  <rect x="92" y="100" width="60" height="10" rx="2" fill="#444"/>
  <rect x="160" y="100" width="60" height="10" rx="2" fill="#444"/>
  <rect x="228" y="100" width="60" height="10" rx="2" fill="#333"/>

  <!-- Blurred name -->
  <rect x="24" y="130" width="140" height="8" rx="2" fill="#555"/>
  <!-- Blurred expiry -->
  <rect x="24" y="146" width="60" height="8" rx="2" fill="#555"/>

  <!-- Blurred CVV (redacted) -->
  <rect x="260" y="146" width="30" height="8" rx="2" fill="#333"/>

  <!-- Card brand circle (vague) -->
  <circle cx="280" cy="60" r="14" fill="#cc0000" opacity="0.5"/>
  <circle cx="296" cy="60" r="14" fill="#ff6600" opacity="0.5"/>

  <!-- Vague blur overlay -->
  <rect x="4" y="4" width="332" height="206" rx="16" fill="url(#blur2)" opacity="0.25"/>
  <defs>
    <linearGradient id="blur2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
</svg>
